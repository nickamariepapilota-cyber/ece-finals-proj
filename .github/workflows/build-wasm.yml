
name: Build C Population Simulator

on:
  push:
    paths:
      - 'main.c'
      - '.github/workflows/build-wasm.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    container:
      image: emscripten/emsdk:latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Compile C to WebAssembly
        run: |
          emcc main.c \
            -O2 \
            --no-entry \
            -sWASM=1 \
            -sMODULARIZE=1 \
            -sEXPORT_NAME=createPopulationSimulator \
            -sENVIRONMENT=web \
            -sALLOW_MEMORY_GROWTH=1 \
            -sEXPORTED_FUNCTIONS='["_get_species_count","_get_initial_population","_get_population_at_year"]' \
            -sEXPORTED_RUNTIME_METHODS='["ccall","cwrap"]' \
            -o population_simulator.js

      - name: Save generated files to repository
        run: |
          git -C "$GITHUB_WORKSPACE" config user.name "github-actions[bot]"
          git -C "$GITHUB_WORKSPACE" config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git -C "$GITHUB_WORKSPACE" add population_simulator.js population_simulator.wasm

          if ! git -C "$GITHUB_WORKSPACE" diff --cached --quiet; then
            git -C "$GITHUB_WORKSPACE" commit -m "Build population simulator WebAssembly"
            git -C "$GITHUB_WORKSPACE" push
          fi

