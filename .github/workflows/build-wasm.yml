
name: Build C Population Simulator

on:
  push:
    paths:
      - 'main.c'
      - '.github/workflows/build-wasm.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  compile:
    runs-on: ubuntu-latest

    container:
      image: emscripten/emsdk:latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Compile C to WebAssembly
        run: |
          emcc main.c \
            -O2 \
            --no-entry \
            -sWASM=1 \
            -sMODULARIZE=1 \
            -sEXPORT_NAME=createPopulationSimulator \
            -sENVIRONMENT=web \
            -sALLOW_MEMORY_GROWTH=1 \
            -sEXPORTED_FUNCTIONS='["_get_species_count","_get_initial_population","_get_population_at_year"]' \
            -sEXPORTED_RUNTIME_METHODS='["ccall","cwrap"]' \
            -o population_simulator.js

      - name: Upload generated files
        uses: actions/upload-artifact@v4
        with:
          name: population-wasm
          path: |
            population_simulator.js
            population_simulator.wasm
          if-no-files-found: error

  save:
    runs-on: ubuntu-latest
    needs: compile

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download generated files
        uses: actions/download-artifact@v4
        with:
          name: population-wasm
          path: build-output

      - name: Commit generated files
        run: |
          cp build-output/population_simulator.js .
          cp build-output/population_simulator.wasm .

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add population_simulator.js population_simulator.wasm

          if ! git diff --cached --quiet; then
            git commit -m "Build population simulator WebAssembly"
            git push
          fi

